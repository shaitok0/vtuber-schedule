
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oriens 配信スケジュール</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #f5f5fa;
      color: #222;
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 23px; }
    .note { color: #666; font-size: 13px; }
    #schedule { display: grid; gap: 14px; }
    .stream {
      display: flex;
      gap: 12px;
      background: white;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    .stream img {
      width: 42%;
      height: auto;
      align-self: flex-start;
      object-fit: cover;
      border-radius: 8px;
    }
    .info { min-width: 0; }
    .name { font-size: 13px; color: #6554a4; font-weight: bold; }
    .title {
      font-size: 15px;
      font-weight: bold;
      margin: 7px 0;
      overflow-wrap: anywhere;
    }
    .date { font-size: 12px; color: #666; }
    a { color: inherit; text-decoration: none; }
    .message {
      background: white;
      border-radius: 12px;
      padding: 16px;
    }
  </style>
</head>
<body>
  <h1>📺 Oriens 配信スケジュール</h1>
  <p class="note">
    配信予定を自動で読み込むよ！
  </p>
  <main id="schedule">
    <p class="message">スケジュールを読み込み中…</p>
  </main>

  <script>
    async function readJSON(path) {
      try {
        const response = await fetch(path);
        if (!response.ok) return [];
        const data = await response.json();
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    async function loadSchedule() {
      const area = document.getElementById("schedule");

      const [automatic, manual] = await Promise.all([
        readJSON("./schedule.json"),
        readJSON("./manual_schedule.json")
      ]);

      // 手動登録した予定を優先し、URLの重複を防ぐ
      const items = [...manual, ...automatic];
      const unique = new Map();

      for (const item of items) {
        if (!item.url || !item.scheduledAt) continue;
        const key = item.url;
        if (!unique.has(key)) unique.set(key, item);
      }

      const upcoming = [...unique.values()]
        .filter(item => new Date(item.scheduledAt).getTime() >= Date.now())
        .sort((a, b) =>
          new Date(a.scheduledAt) - new Date(b.scheduledAt)
        );

      if (!upcoming.length) {
        area.innerHTML =
          '<p class="message">現在、配信予定はありません。</p>';
        return;
      }

      area.innerHTML = upcoming.map(item => {
        const date = new Date(item.scheduledAt);
        const dateText = new Intl.DateTimeFormat("ja-JP", {
          month: "numeric",
          day: "numeric",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          timeZone: "Asia/Tokyo"
        }).format(date);

        const thumbnail = item.thumbnail
          ? `<a href="${escapeHTML(item.url)}" target="_blank" rel="noopener">
               <img src="${escapeHTML(item.thumbnail)}" alt="">
             </a>`
          : "";

        return `
          <article class="stream">
            ${thumbnail}
            <div class="info">
              <div class="name">${escapeHTML(item.name)}</div>
              <div class="title">
                <a href="${escapeHTML(item.url)}"
                   target="_blank" rel="noopener">
                  ${escapeHTML(item.title)}
                </a>
              </div>
              <div class="date">🗓 ${dateText}</div>
              <p>
                <a href="${escapeHTML(item.url)}"
                   target="_blank" rel="noopener">
                  ▶ YouTubeで見る
                </a>
              </p>
            </div>
          </article>`;
      }).join("");
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    loadSchedule();
  </script>
</body>
</html>
