
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oriens 配信スケジュール</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #f5f5fa;
      color: #222;
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 23px; }
    .note { color: #666; font-size: 13px; }
    #schedule {
      display: grid;
      gap: 14px;
    }
    .stream {
      display: flex;
      gap: 12px;
      background: white;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    .stream img {
      width: 42%;
      height: auto;
      align-self: flex-start;
      object-fit: cover;
      border-radius: 8px;
    }
    .info { min-width: 0; }
    .name { font-size: 13px; color: #6554a4; font-weight: bold; }
    .title {
      font-size: 15px;
      font-weight: bold;
      margin: 7px 0;
      overflow-wrap: anywhere;
    }
    .date { font-size: 12px; color: #666; }
    a { color: inherit; text-decoration: none; }
    .message {
      background: white;
      border-radius: 12px;
      padding: 16px;
    }
  </style>
</head>
<body>
  <h1>📺 Oriens 配信スケジュール</h1>
  <p class="note">配信予定を自動で読み込むよ！</p>
  <main id="schedule">
    <p class="message">スケジュールを読み込み中…</p>
  </main>

  <script>
    async function loadSchedule() {
      const area = document.getElementById("schedule");
      try {
        const response = await fetch("./schedule.json");
        if (!response.ok) throw new Error("読み込み失敗");
        const items = await response.json();

        items.sort((a, b) =>
          new Date(a.scheduledAt) - new Date(b.scheduledAt)
        );

        if (!items.length) {
          area.innerHTML = '<p class="message">現在、配信予定はありません。</p>';
          return;
        }

        area.innerHTML = items.map(item => {
          const date = new Date(item.scheduledAt);
          const dateText = new Intl.DateTimeFormat("ja-JP", {
            month: "numeric",
            day: "numeric",
            weekday: "short",
            hour: "2-digit",
            minute: "2-digit",
            timeZone: "Asia/Tokyo"
          }).format(date);

          return `
            <article class="stream">
              <a href="${item.url}" target="_blank" rel="noopener">
                <img src="${item.thumbnail}" alt="">
              </a>
              <div class="info">
                <div class="name">${escapeHTML(item.name)}</div>
                <div class="title">
                  <a href="${item.url}" target="_blank" rel="noopener">
                    ${escapeHTML(item.title)}
                  </a>
                </div>
                <div class="date">🗓 ${dateText}</div>
                <p><a href="${item.url}" target="_blank" rel="noopener">▶ YouTubeで見る</a></p>
              </div>
            </article>`;
        }).join("");
      } catch (error) {
        area.innerHTML =
          '<p class="message">予定を読み込めなかったよ。少し待ってから再読み込みしてね。</p>';
      }
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    loadSchedule();
  </script>
</body>
</html>
